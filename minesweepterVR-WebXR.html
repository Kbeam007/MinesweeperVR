<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Graph Minesweeper VR - Meta Quest</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: 0 0 10px rgba(0, 255, 102, 0.6);
            --bg-dark: rgba(5, 15, 8, 0.88);
        }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background-color: #000; overflow: hidden; font-family: 'Courier New', monospace; color: var(--neon-green); }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
        .interactive { pointer-events: auto; }
        header, footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .hud-box { background: var(--bg-dark); border: 2px solid var(--neon-green); box-shadow: var(--neon-glow); border-radius: 8px; padding: 10px 16px; font-size: 14px; text-transform: uppercase; }
        .btn { background: #000; color: var(--neon-green); border: 2px solid var(--neon-green); box-shadow: var(--neon-glow); padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; }
        .btn:hover { background: var(--neon-green); color: #000; }
        .btn.active { background: var(--neon-green); color: #000; }
    </style>

    <!-- Three.js and WebXR Addons -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    
    <div class="ui-layer">
        <header>
            <div class="hud-box interactive">
                Mines: <span id="hud-mines">0</span> | Nodes: <span id="hud-nodes">0</span> | Gen: <span id="hud-gen">Tree</span> | Mode: <span id="hud-mode">Reveal</span>
            </div>
            <div class="hud-box interactive" style="display: flex; gap: 8px;">
                <button class="btn" id="btn-toggle-gen">Gen: Tree</button>
                <button class="btn" id="btn-desktop-toggle-flag">🚩 Flag Mode</button>
                <button class="btn" id="btn-desktop-reset">Reset</button>
            </div>
        </header>
        <footer>
            <div class="hud-box interactive" style="font-size: 12px;">
                <b>VR Controls:</b> Trigger = Reveal/Flag | Grip Drag = Move/Rotate Field | Hands = Physical Finger Poke
            </div>
        </footer>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        /* -------------------------------------------------------------
           1. Audio Synthesizer (Web Audio API)
        ------------------------------------------------------------- */
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type = 'sine', dur = 0.1, gainVal = 0.1) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            }
            click() { this.playTone(800, 'sine', 0.05, 0.08); }
            reveal() { this.playTone(520, 'triangle', 0.12, 0.12); }
            flag() { this.playTone(320, 'square', 0.08, 0.06); }
            unflag() { this.playTone(240, 'square', 0.08, 0.06); }
            win() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.25, 0.15), i * 110)); }
            explode() {
                try {
                    this.init();
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.4);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                    noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }
        }
        const sfx = new SoundFX();

        /* -------------------------------------------------------------
           2. Visual Constants & Cached Material Architecture
        ------------------------------------------------------------- */
        const COLORS = {
            NODE_UNREVEALED: 0x555555,
            NODE_REVEALED: 0x0044ff,
            NODE_HINT: 0xe5dc1a,
            NODE_FLAG: 0xff1111,
            NODE_MINE: 0xff0022,
            LINK_DEFAULT: 0x2e3d30,
            LINK_SAFE: 0x0055ff,
            LINK_MINE: 0xff1111
        };

        // Real-world VR Dimensions (Meters)
        const NODE_RADIUS = 0.045;
        const LINK_RADIUS = 0.005;

        const TEXTURE_CACHE = new Map();
        const MATERIAL_CACHE = new Map();

        function getNumberTexture(number, color = '#ffffff') {
            const key = `${number}_${color}`;
            if (TEXTURE_CACHE.has(key)) return TEXTURE_CACHE.get(key);

            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, 128, 128);
            ctx.fillStyle = color;
            ctx.font = 'bold 88px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(number.toString(), 64, 64);

            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.generateMipmaps = false;
            TEXTURE_CACHE.set(key, tex);
            return tex;
        }

        function getNumberMaterial(number, color = '#ffffff') {
            const key = `${number}_${color}`;
            if (MATERIAL_CACHE.has(key)) return MATERIAL_CACHE.get(key);

            const tex = getNumberTexture(number, color);
            const mat = new THREE.SpriteMaterial({
                map: tex,
                depthTest: true,
                depthWrite: false,
                transparent: true
            });
            MATERIAL_CACHE.set(key, mat);
            return mat;
        }

        function createNumberSprite(number, color = '#ffffff') {
            const mat = getNumberMaterial(number, color);
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(NODE_RADIUS * 1.55, NODE_RADIUS * 1.55, 1);
            return sprite;
        }

        /* -------------------------------------------------------------
           3. WebXR Game Engine & Dual Graph Generators
        ------------------------------------------------------------- */
        class MinesweeperVR {
            constructor() {
                this.nodes = [];
                this.links = [];
                this.inGame = true;
                this.firstClick = true;
                this.flagMode = false;
                this.hoveredNode = null;
                this.genAlgorithm = 'tree'; // 'tree' or 'poisson'

                // VR Sized Graph Configuration (Dimensions in meters)
                this.config = {
                    tree: {
                        maxNodes: 38,
                        levels: 3,
                        branches: 3,
                        linkLength: 0.16,
                        minNodeDist: 0.12,
                        maxSecDist: 0.22,
                        mines: 7
                    },
                    poisson: {
                        maxNodes: 36,
                        radius: 0.13,
                        boxSize: 0.65,
                        connectionMultiplier: 1.6,
                        mines: 7
                    }
                };

                // World manipulation state
                this.grabbedBy = [];
                this.previousControllerMatrix = new THREE.Matrix4();

                // Reusable pre-allocated math objects to eliminate runtime GC frame-drops
                this.camPos = new THREE.Vector3();
                this.localDir = new THREE.Vector3();
                this.tempVec = new THREE.Vector3();
                this.tempNodePos = new THREE.Vector3();
                this.workingMatrix = new THREE.Matrix4();
                this.sharedSphereGeo = new THREE.SphereGeometry(NODE_RADIUS, 20, 20);

                this.initGraphics();
                this.initWebXR();
                this.initDesktopControls();
                this.createSpatialHUD();
                this.startNewGame();
            }

            initGraphics() {
                this.canvas = document.getElementById('webgl-canvas');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x040805);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 100);
                this.camera.position.set(0, 1.4, 0.9);

                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.xr.enabled = true;
                document.body.appendChild(VRButton.createButton(this.renderer));

                this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
                dirLight.position.set(5, 10, 7);
                this.scene.add(dirLight);

                // Central interactive space pinned directly in front of the Quest user
                this.worldAnchor = new THREE.Group();
                this.worldAnchor.position.set(0, 1.25, -0.65);
                this.scene.add(this.worldAnchor);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            initWebXR() {
                this.controllerModelFactory = new XRControllerModelFactory();
                this.handModelFactory = new XRHandModelFactory();
                this.controllers = [];
                this.hands = [];
                this.raycaster = new THREE.Raycaster();

                for (let i = 0; i < 2; i++) {
                    const controller = this.renderer.xr.getController(i);
                    this.scene.add(controller);

                    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.6 });
                    const laser = new THREE.Line(lineGeo, lineMat);
                    laser.name = 'laser';
                    laser.scale.z = 1.5;
                    controller.add(laser);

                    const grip = this.renderer.xr.getControllerGrip(i);
                    grip.add(this.controllerModelFactory.createControllerModel(grip));
                    this.scene.add(grip);

                    const hand = this.renderer.xr.getHand(i);
                    hand.add(this.handModelFactory.createHandModel(hand, "mesh"));
                    this.scene.add(hand);

                    controller.addEventListener('connected', (e) => {
                        controller.userData.gamepad = e.data.gamepad;
                    });
                    controller.addEventListener('disconnected', () => {
                        controller.userData.gamepad = null;
                    });

                    controller.addEventListener('selectstart', () => this.onXRTriggerDown(controller));
                    controller.addEventListener('squeezestart', () => this.onXRGripStart(controller));
                    controller.addEventListener('squeezeend', () => this.onXRGripEnd(controller));

                    this.controllers.push(controller);
                    this.hands.push(hand);
                }
            }

            createSpatialHUD() {
                this.hudCanvas = document.createElement('canvas');
                this.hudCanvas.width = 512; 
                this.hudCanvas.height = 160;
                this.hudCtx = this.hudCanvas.getContext('2d');

                this.hudTexture = new THREE.CanvasTexture(this.hudCanvas);
                this.hudTexture.generateMipmaps = false;
                this.hudTexture.minFilter = THREE.LinearFilter;

                const hudGeo = new THREE.PlaneGeometry(0.55, 0.17);
                const hudMat = new THREE.MeshBasicMaterial({ map: this.hudTexture, transparent: true });

                this.hudMesh = new THREE.Mesh(hudGeo, hudMat);
                this.hudMesh.position.set(0, 0.42, 0);
                this.worldAnchor.add(this.hudMesh);
            }

            updateHUD() {
                const curMines = this.getCurrentMineCount();
                let remaining = curMines;
                let unrevealed = 0;
                for (let n of this.nodes) {
                    if (n.isFlagged) remaining--;
                    if (!n.isRevealed) unrevealed++;
                }

                // 2D Web HUD
                document.getElementById('hud-mines').textContent = Math.max(0, remaining);
                document.getElementById('hud-nodes').textContent = unrevealed;
                document.getElementById('hud-gen').textContent = this.genAlgorithm === 'poisson' ? 'Poisson' : 'Tree';
                document.getElementById('hud-mode').textContent = this.flagMode ? '🚩 Flag' : '⛏️ Reveal';
                document.getElementById('btn-toggle-gen').textContent = `Gen: ${this.genAlgorithm === 'poisson' ? 'Poisson' : 'Tree'}`;

                // In-World 3D Spatial Canvas
                this.hudCtx.fillStyle = 'rgba(5, 20, 10, 0.88)';
                this.hudCtx.fillRect(0, 0, 512, 160);
                this.hudCtx.strokeStyle = '#00ff66';
                this.hudCtx.lineWidth = 6;
                this.hudCtx.strokeRect(4, 4, 504, 152);

                this.hudCtx.fillStyle = '#00ff66';
                this.hudCtx.font = 'bold 32px monospace';
                this.hudCtx.textAlign = 'center';
                this.hudCtx.fillText(`MINES: ${Math.max(0, remaining)} | LEFT: ${unrevealed}`, 256, 45);

                this.hudCtx.font = '24px monospace';
                this.hudCtx.fillStyle = '#88ffaa';
                this.hudCtx.fillText(`ALGO: ${this.genAlgorithm.toUpperCase()} GRAPH`, 256, 88);

                this.hudCtx.fillStyle = this.flagMode ? '#ff3333' : '#00ff66';
                this.hudCtx.fillText(`TOOL: ${this.flagMode ? 'FLAGGING [🚩]' : 'REVEALING [⛏️]'}`, 256, 130);

                this.hudTexture.needsUpdate = true;
            }

            getCurrentMineCount() {
                return this.genAlgorithm === 'poisson' ? this.config.poisson.mines : this.config.tree.mines;
            }

            clearGraph() {
                while (this.worldAnchor.children.length > 0) {
                    const obj = this.worldAnchor.children[0];
                    if (obj === this.hudMesh) {
                        this.worldAnchor.remove(obj);
                    } else {
                        this.worldAnchor.remove(obj);
                        if (obj.geometry && obj.geometry !== this.sharedSphereGeo) obj.geometry.dispose();
                    }
                }
                this.worldAnchor.add(this.hudMesh);
                this.nodes = [];
                this.links = [];
            }

            /* -------------------------------------------------------------
               Algorithm A: Recursive Tree Branching (Scaled for VR)
            ------------------------------------------------------------- */
            generateTreeGraph() {
                this.clearGraph();
                const cfg = this.config.tree;

                this.addNode(new THREE.Vector3(0, 0, 0));
                const queue = [{ id: 0, level: 0 }];

                while (queue.length > 0 && this.nodes.length < cfg.maxNodes) {
                    const curr = queue.shift();
                    if (curr.level >= cfg.levels) continue;

                    for (let b = 0; b < cfg.branches; b++) {
                        if (this.nodes.length >= cfg.maxNodes) break;

                        let found = false;
                        const candPos = new THREE.Vector3();

                        for (let attempts = 0; attempts < 35; attempts++) {
                            const randDir = new THREE.Vector3(
                                (Math.random() - 0.5) * 2,
                                (Math.random() - 0.5) * 2,
                                (Math.random() - 0.5) * 2
                            ).normalize();

                            candPos.copy(this.nodes[curr.id].pos).addScaledVector(randDir, cfg.linkLength);

                            let tooClose = false;
                            for (let n of this.nodes) {
                                if (candPos.distanceTo(n.pos) < cfg.minNodeDist) {
                                    tooClose = true;
                                    break;
                                }
                            }
                            if (!tooClose) {
                                found = true;
                                break;
                            }
                        }

                        if (found) {
                            const newId = this.addNode(candPos);
                            this.addConnection(curr.id, newId);
                            queue.push({ id: newId, level: curr.level + 1 });
                        }
                    }
                }

                // Add secondary cyclic connections for web topology
                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const dist = this.nodes[i].pos.distanceTo(this.nodes[j].pos);
                        if (dist <= cfg.maxSecDist && dist >= cfg.minNodeDist * 0.8) {
                            if (this.nodes[i].neighbors.length < 5 && this.nodes[j].neighbors.length < 5) {
                                if (!this.nodes[i].neighbors.includes(j)) {
                                    this.addConnection(i, j);
                                }
                            }
                        }
                    }
                }
            }

            /* -------------------------------------------------------------
               Algorithm B: 3D Poisson Disk Sampling (Scaled for VR)
            ------------------------------------------------------------- */
            generatePoissonGraph() {
                this.clearGraph();
                const cfg = this.config.poisson;
                const r = cfg.radius;
                const sqRadius = r * r;
                const maxPoints = cfg.maxNodes;
                const k = 30;
                const boxSize = cfg.boxSize;
                const halfBox = boxSize / 2;

                const cellSize = r / Math.sqrt(3);
                const gridDim = Math.ceil(boxSize / cellSize);
                const grid = new Int32Array(gridDim * gridDim * gridDim).fill(-1);
                const getGridIdx = (gx, gy, gz) => (gx * gridDim + gy) * gridDim + gz;

                const points = [];
                const spawnPoints = [];

                const firstPt = new THREE.Vector3(0, 0, 0);
                points.push(firstPt);
                spawnPoints.push(firstPt);

                const gX = Math.floor((firstPt.x + halfBox) / cellSize);
                const gY = Math.floor((firstPt.y + halfBox) / cellSize);
                const gZ = Math.floor((firstPt.z + halfBox) / cellSize);
                grid[getGridIdx(gX, gY, gZ)] = 0;

                const isValid = (candidate) => {
                    if (candidate.x < -halfBox || candidate.x >= halfBox ||
                        candidate.y < -halfBox || candidate.y >= halfBox ||
                        candidate.z < -halfBox || candidate.z >= halfBox) {
                        return false;
                    }

                    const cx = Math.floor((candidate.x + halfBox) / cellSize);
                    const cy = Math.floor((candidate.y + halfBox) / cellSize);
                    const cz = Math.floor((candidate.z + halfBox) / cellSize);

                    const startX = Math.max(0, cx - 2);
                    const endX = Math.min(gridDim - 1, cx + 2);
                    const startY = Math.max(0, cy - 2);
                    const endY = Math.min(gridDim - 1, cy + 2);
                    const startZ = Math.max(0, cz - 2);
                    const endZ = Math.min(gridDim - 1, cz + 2);

                    for (let x = startX; x <= endX; x++) {
                        for (let y = startY; y <= endY; y++) {
                            for (let z = startZ; z <= endZ; z++) {
                                const ptIdx = grid[getGridIdx(x, y, z)];
                                if (ptIdx !== -1) {
                                    if (candidate.distanceToSquared(points[ptIdx]) < sqRadius) return false;
                                }
                            }
                        }
                    }
                    return true;
                };

                while (spawnPoints.length > 0 && points.length < maxPoints) {
                    const spawnIndex = Math.floor(Math.random() * spawnPoints.length);
                    const spawnCentre = spawnPoints[spawnIndex];
                    let accepted = false;

                    for (let i = 0; i < k; i++) {
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        const radiusOffset = r + Math.random() * r;

                        const candidate = new THREE.Vector3(
                            spawnCentre.x + radiusOffset * Math.sin(phi) * Math.cos(theta),
                            spawnCentre.y + radiusOffset * Math.sin(phi) * Math.sin(theta),
                            spawnCentre.z + radiusOffset * Math.cos(phi)
                        );

                        if (isValid(candidate)) {
                            const newIdx = points.length;
                            points.push(candidate);
                            spawnPoints.push(candidate);

                            const cx = Math.floor((candidate.x + halfBox) / cellSize);
                            const cy = Math.floor((candidate.y + halfBox) / cellSize);
                            const cz = Math.floor((candidate.z + halfBox) / cellSize);
                            grid[getGridIdx(cx, cy, cz)] = newIdx;

                            accepted = true;
                            if (points.length >= maxPoints) break;
                        }
                    }

                    if (!accepted) spawnPoints.splice(spawnIndex, 1);
                }

                points.forEach(pt => this.addNode(pt));

                const connectionRadius = r * cfg.connectionMultiplier;
                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const dist = this.nodes[i].pos.distanceTo(this.nodes[j].pos);
                        if (dist <= connectionRadius) {
                            if (this.nodes[i].neighbors.length < 5 && this.nodes[j].neighbors.length < 5) {
                                this.addConnection(i, j);
                            }
                        }
                    }
                }

                // Prevent isolated island nodes
                for (let i = 0; i < this.nodes.length; i++) {
                    if (this.nodes[i].neighbors.length === 0) {
                        let closest = -1, minD = Infinity;
                        for (let j = 0; j < this.nodes.length; j++) {
                            if (i === j) continue;
                            const d = this.nodes[i].pos.distanceTo(this.nodes[j].pos);
                            if (d < minD) { minD = d; closest = j; }
                        }
                        if (closest !== -1) this.addConnection(i, closest);
                    }
                }
            }

            addNode(pos) {
                const id = this.nodes.length;
                const mat = new THREE.MeshStandardMaterial({
                    color: COLORS.NODE_UNREVEALED,
                    roughness: 0.35,
                    metalness: 0.15
                });
                const mesh = new THREE.Mesh(this.sharedSphereGeo, mat);
                mesh.position.copy(pos);
                mesh.userData = { nodeId: id };
                this.worldAnchor.add(mesh);

                this.nodes.push({
                    id, pos: pos.clone(), mesh, sprite: null, neighbors: [], links: [],
                    isMine: false, isRevealed: false, isFlagged: false, isHinted: false, adjMines: 0
                });
                return id;
            }

            addConnection(a, b) {
                const p1 = this.nodes[a].pos;
                const p2 = this.nodes[b].pos;
                const dir = new THREE.Vector3().subVectors(p2, p1);
                const len = dir.length();

                const geom = new THREE.CylinderGeometry(LINK_RADIUS, LINK_RADIUS, len, 6);
                geom.translate(0, len / 2, 0);
                geom.rotateX(Math.PI / 2);

                const mat = new THREE.MeshStandardMaterial({ color: COLORS.LINK_DEFAULT, roughness: 0.5 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.copy(p1);
                mesh.lookAt(p2);
                this.worldAnchor.add(mesh);

                const linkId = this.links.length;
                this.links.push({ id: linkId, a, b, mesh });
                this.nodes[a].neighbors.push(b);
                this.nodes[a].links.push(linkId);
                this.nodes[b].neighbors.push(a);
                this.nodes[b].links.push(linkId);
            }

            buildNetwork() {
                if (this.genAlgorithm === 'poisson') {
                    this.generatePoissonGraph();
                } else {
                    this.generateTreeGraph();
                }
            }

            updateLinksColor() {
                for (let link of this.links) {
                    const na = this.nodes[link.a];
                    const nb = this.nodes[link.b];

                    if (na.isFlagged || nb.isFlagged) {
                        link.mesh.material.color.setHex(COLORS.LINK_MINE);
                    } else if (na.isRevealed && nb.isRevealed) {
                        link.mesh.material.color.setHex(COLORS.LINK_SAFE);
                    } else {
                        link.mesh.material.color.setHex(COLORS.LINK_DEFAULT);
                    }
                }
            }

            plantMines(startNodeId) {
                const totalMines = this.getCurrentMineCount();
                let planted = 0;
                while (planted < totalMines) {
                    const idx = Math.floor(Math.random() * this.nodes.length);
                    if (idx === startNodeId || this.nodes[startNodeId].neighbors.includes(idx)) continue;
                    if (!this.nodes[idx].isMine) {
                        this.nodes[idx].isMine = true;
                        planted++;
                    }
                }
                for (let n of this.nodes) {
                    n.adjMines = n.neighbors.filter(nb => this.nodes[nb].isMine).length;
                }
            }

            revealNode(id) {
                const node = this.nodes[id];
                if (!this.inGame || node.isRevealed || node.isFlagged) return;

                if (this.firstClick) {
                    this.firstClick = false;
                    this.plantMines(id);
                }

                if (node.isMine) {
                    this.inGame = false;
                    sfx.explode();
                    node.mesh.material.color.setHex(COLORS.NODE_MINE);
                    this.revealBoardOnLoss();
                    return;
                }

                node.isRevealed = true;
                node.mesh.material.color.setHex(COLORS.NODE_REVEALED);
                sfx.reveal();

                this.attachNumberSprite(node, '#ffffff');

                for (let nbId of node.neighbors) {
                    const nb = this.nodes[nbId];
                    if (!nb.isRevealed && !nb.isFlagged) {
                        nb.isHinted = true;
                        nb.mesh.material.color.setHex(COLORS.NODE_HINT);
                        this.attachNumberSprite(nb, '#000000');
                    }
                }

                if (node.adjMines === 0) {
                    for (let nb of node.neighbors) {
                        if (!this.nodes[nb].isRevealed) this.revealNode(nb);
                    }
                }

                this.updateLinksColor();
                this.updateHUD();
                this.checkWin();
            }

            toggleFlag(id) {
                const node = this.nodes[id];
                if (!this.inGame || node.isRevealed) return;

                node.isFlagged = !node.isFlagged;
                if (node.isFlagged) {
                    sfx.flag();
                    node.mesh.material.color.setHex(COLORS.NODE_FLAG);
                    if (node.sprite) node.sprite.visible = false;
                } else {
                    sfx.unflag();
                    node.mesh.material.color.setHex(node.isHinted ? COLORS.NODE_HINT : COLORS.NODE_UNREVEALED);
                    if (node.sprite) node.sprite.visible = true;
                }
                
                this.updateLinksColor();
                this.updateHUD();
                this.checkWin();
            }

            attachNumberSprite(node, color) {
                if (node.sprite) {
                    node.mesh.remove(node.sprite);
                    node.sprite = null;
                }
                const sprite = createNumberSprite(node.adjMines, color);
                node.mesh.add(sprite);
                node.sprite = sprite;
                this.orientSprite(node);
            }

            getActiveCamera() {
                return (this.renderer.xr && this.renderer.xr.isPresenting) 
                    ? this.renderer.xr.getCamera() 
                    : this.camera;
            }

            orientSprite(node) {
                if (!node.sprite || !node.sprite.visible) return;
                const cam = this.getActiveCamera();
                cam.getWorldPosition(this.camPos);

                this.localDir.copy(this.camPos);
                node.mesh.worldToLocal(this.localDir);

                if (this.localDir.lengthSq() > 0.0001) {
                    this.localDir.normalize().multiplyScalar(NODE_RADIUS + 0.008);
                    node.sprite.position.copy(this.localDir);
                }
            }

            updateAllSprites() {
                for (let i = 0; i < this.nodes.length; i++) {
                    this.orientSprite(this.nodes[i]);
                }
            }

            revealBoardOnLoss() {
                for (let n of this.nodes) {
                    if (n.isMine) {
                        n.mesh.material.color.setHex(COLORS.NODE_MINE);
                    } else {
                        n.mesh.material.color.setHex(COLORS.NODE_REVEALED);
                        this.attachNumberSprite(n, '#ffffff');
                    }
                }
                for (let l of this.links) {
                    const na = this.nodes[l.a];
                    const nb = this.nodes[l.b];
                    if (na.isMine || nb.isMine) {
                        l.mesh.material.color.setHex(COLORS.LINK_MINE);
                    } else {
                        l.mesh.material.color.setHex(COLORS.LINK_SAFE);
                    }
                }
            }

            checkWin() {
                const totalMines = this.getCurrentMineCount();
                let correctFlags = 0;
                let safeRevealed = 0;
                for (let n of this.nodes) {
                    if (n.isFlagged && n.isMine) correctFlags++;
                    if (n.isRevealed && !n.isMine) safeRevealed++;
                }
                if (safeRevealed === this.nodes.length - totalMines || correctFlags === totalMines) {
                    this.inGame = false;
                    sfx.win();
                }
            }

            onXRTriggerDown(controller) {
                this.triggerHaptic(controller, 0.7, 40);
                if (this.hoveredNode) {
                    if (this.flagMode) this.toggleFlag(this.hoveredNode.id);
                    else this.revealNode(this.hoveredNode.id);
                }
            }

            onXRGripStart(controller) {
                this.grabbedBy.push(controller);
                this.previousControllerMatrix.copy(controller.matrixWorld);
            }

            onXRGripEnd(controller) {
                this.grabbedBy = this.grabbedBy.filter(c => c !== controller);
            }

            triggerHaptic(controller, intensity = 0.5, duration = 30) {
                const gamepad = controller.userData?.gamepad;
                try {
                    if (gamepad?.hapticActuators?.[0]?.pulse) {
                        gamepad.hapticActuators[0].pulse(intensity, duration);
                    }
                } catch(e) {}
            }

            handleVRInteractions() {
                let foundHover = null;
                const nodeMeshes = this.nodes.map(n => n.mesh);

                this.raycaster.camera = this.getActiveCamera();

                for (let controller of this.controllers) {
                    this.workingMatrix.identity().extractRotation(controller.matrixWorld);
                    this.raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    this.raycaster.ray.direction.set(0, 0, -1).applyMatrix4(this.workingMatrix);

                    const hits = this.raycaster.intersectObjects(nodeMeshes, false);
                    const laser = controller.getObjectByName('laser');
                    if (hits.length > 0) {
                        foundHover = this.nodes[hits[0].object.userData.nodeId];
                        if (laser) laser.scale.z = hits[0].distance;
                        break;
                    } else {
                        if (laser) laser.scale.z = 1.5;
                    }
                }

                // Direct Physical Hand Finger Poke
                for (let hand of this.hands) {
                    if (hand.joints) {
                        const indexTip = hand.joints['index-finger-tip'];
                        if (indexTip) {
                            const tipPos = this.tempVec.setFromMatrixPosition(indexTip.matrixWorld);
                            for (let n of this.nodes) {
                                const nWorld = n.mesh.getWorldPosition(this.tempNodePos);
                                if (tipPos.distanceTo(nWorld) < NODE_RADIUS * 1.3) {
                                    foundHover = n;
                                    if (!n.isRevealed && !n.isFlagged) {
                                        this.revealNode(n.id);
                                    }
                                }
                            }
                        }
                    }
                }

                if (this.hoveredNode !== foundHover) {
                    if (this.hoveredNode) this.hoveredNode.mesh.scale.set(1, 1, 1);
                    this.hoveredNode = foundHover;
                    if (this.hoveredNode) {
                        this.hoveredNode.mesh.scale.set(1.3, 1.3, 1.3);
                        this.triggerHaptic(this.controllers[0], 0.2, 15);
                    }
                }

                // 6DoF Field Manipulation via Grip Drag
                if (this.grabbedBy.length === 1) {
                    const c = this.grabbedBy[0];
                    const delta = new THREE.Matrix4().copy(c.matrixWorld).multiply(this.previousControllerMatrix.invert());
                    this.worldAnchor.applyMatrix4(delta);
                    this.previousControllerMatrix.copy(c.matrixWorld);
                }
            }

            initDesktopControls() {
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.target.copy(this.worldAnchor.position);
                this.controls.enableDamping = true;

                const mouse = new THREE.Vector2();
                const dRay = new THREE.Raycaster();

                window.addEventListener('pointerup', (e) => {
                    if (this.renderer.xr.isPresenting) return;
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    dRay.setFromCamera(mouse, this.camera);

                    const hits = dRay.intersectObjects(this.nodes.map(n => n.mesh), false);
                    if (hits.length > 0) {
                        const id = hits[0].object.userData.nodeId;
                        if (e.button === 2 || this.flagMode) this.toggleFlag(id);
                        else this.revealNode(id);
                    }
                });

                document.getElementById('btn-desktop-toggle-flag').onclick = () => {
                    this.flagMode = !this.flagMode;
                    document.getElementById('btn-desktop-toggle-flag').classList.toggle('active', this.flagMode);
                    this.updateHUD();
                };

                document.getElementById('btn-toggle-gen').onclick = () => {
                    this.genAlgorithm = this.genAlgorithm === 'tree' ? 'poisson' : 'tree';
                    this.startNewGame();
                };

                document.getElementById('btn-desktop-reset').onclick = () => this.startNewGame();
                window.addEventListener('contextmenu', e => e.preventDefault());
            }

            startNewGame() {
                this.firstClick = true;
                this.inGame = true;
                this.buildNetwork();
                this.updateHUD();
            }

            render() {
                if (this.renderer.xr.isPresenting) {
                    this.handleVRInteractions();
                } else {
                    this.controls.update();
                }

                this.updateAllSprites();
                this.renderer.render(this.scene, this.camera);
            }
        }

        /* -------------------------------------------------------------
           4. Application Bootstrap
        ------------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            const app = new MinesweeperVR();
            app.renderer.setAnimationLoop(() => {
                app.render();
            });
        });
    </script>
</body>
</html>
